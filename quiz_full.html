    let score = 0;

    const quizDiv = document.getElementById('quiz');
    const resDiv = document.getElementById('result');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const skipBtn = document.getElementById('skipBtn');
    const scoreEl = document.getElementById('score');
    const totalQEl = document.getElementById('totalQ');
    const bar = document.getElementById('bar');

    totalQEl.textContent = questions.length;

    function render() {
      if (currentQ >= questions.length) {
        quizDiv.innerHTML = "<h3>🎉 Bạn đã hoàn thành tất cả câu hỏi!</h3>";
        resDiv.textContent = "Điểm của bạn: " + score + "/" + questions.length + " (" + Math.round(score*100/questions.length) + "%)";
        nextBtn.style.display = "none";
        submitBtn.style.display = "none";
        skipBtn.style.display = "none";
        bar.style.width = "100%";
        return;
      }
      const q = questions[currentQ];
      let html = `<div class="question">${q.question}</div><ul class="answers">`;
      q.answers.forEach((a, i) => {
        html += `<li><label><input type="radio" name="answer" value="${i}"> ${a}</label></li>`;
      });
      html += "</ul>";
      quizDiv.innerHTML = html;
      nextBtn.style.display = "none";
      resDiv.textContent = "";
      scoreEl.textContent = score;
      bar.style.width = ((currentQ)/questions.length*100).toFixed(2) + "%";
    }

    function getSelected() {
      const opts = document.getElementsByName('answer');
      for (let i=0;i<opts.length;i++) if (opts[i].checked) return parseInt(opts[i].value);
      return -1;
    }

    submitBtn.addEventListener('click', () => {
      const sel = getSelected();
      if (sel === -1) { alert("Bạn hãy chọn một đáp án!"); return; }
      if (sel === questions[currentQ].correct) {
        score++; resDiv.textContent = "✅ Chính xác!";
        nextBtn.style.display = "inline-block";
      } else {
        resDiv.textContent = "❌ Sai rồi, thử lại!";
      }
      scoreEl.textContent = score;
    });

    nextBtn.addEventListener('click', () => { currentQ++; render(); });

    skipBtn.addEventListener('click', () => {
      // Cho phép bỏ qua 1 câu nếu nghi ngờ đáp án khóa
      currentQ++; render();
    });

    render();
