            { question: "Hình thức của thị thực là", options: ["A. Thị thực được cấp riêng cho từng người, trừ trường hợp trẻ em dưới 9 tuổi được cấp chung với cha, mẹ, người giám hộ.", "B. Thị thực được cấp riêng cho từng người.", "C. Thị thực được cấp chung cho cả gia đình.", "D. Cả 3 đáp án đều sai."], answer: "A" },
            { question: "Người nước ngoài là", options: ["A. Người mang giấy tờ xác định quốc tịch nước ngoài.", "B. Người không quốc tịch.", "C. Người nhập cảnh, xuất cảnh, quá cảnh, cư trú tại Việt Nam.", "D. Người mang giấy tờ xác định quốc tịch nước ngoài và người không quốc tịch nhập cảnh, xuất cảnh, quá cảnh, cư trú tại Việt Nam."], answer: "D" },
            { question: "Mục đích của giai đoạn mở đầu giao tiếp là", options: ["A. Tin tưởng.", "B. Thiện cảm.", "C. Tin yêu và thiện cảm.", "D. Tất cả đều sai."], answer: "C" },
            { question: "Đất nước của những nụ cười là nước", options: ["A. Việt Nam.", "B. Campuchia.", "C. Lào.", "D. Thái Lan."], answer: "D" },
            { question: "Cách sắp xếp chỗ ngồi xung quanh bàn tiệc tròn với khách danh dự?", options: ["A. Xếp khách danh dự ngồi trước mặt ông chủ.", "B. Xếp khách danh dự ngồi bên phải ông chủ.", "C. Xếp khách danh dự ngồi bên trái ông chủ.", "D. Xếp khách danh dự ngồi đối diện ông chủ."], answer: "A" },
            { question: "Tiệc đứng trong ngoại giao được phân chia thành mấy hình thức", options: ["A. Một hình thức.", "B. Hai hình thức.", "C. Ba hình thức.", "D. Bốn hình thức."], answer: "B" }
        ];

        let currentQuestionIndex = 0;
        let shuffledQuestions = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function loadQuestion() {
            if (currentQuestionIndex >= shuffledQuestions.length) {
                document.querySelector('.quiz-container').innerHTML = '<h2>Bạn đã hoàn thành bài kiểm tra!</h2>';
                return;
            }

            const currentQuestion = shuffledQuestions[currentQuestionIndex];
            document.querySelector('.question-counter').textContent = `Câu hỏi ${currentQuestionIndex + 1}/${shuffledQuestions.length}`;
            document.querySelector('.question-text').textContent = currentQuestion.question;

            const optionsList = document.querySelector('.options');
            optionsList.innerHTML = '';
            currentQuestion.options.forEach(option => {
                const li = document.createElement('li');
                li.innerHTML = `<label><input type="radio" name="answer">${option}</label>`;
                li.onclick = () => checkAnswer(li, option.charAt(0));
                optionsList.appendChild(li);
            });
            document.querySelector('.feedback').textContent = '';
        }

        function checkAnswer(selectedLi, selectedOption) {
            const currentQuestion = shuffledQuestions[currentQuestionIndex];
            const feedbackElement = document.querySelector('.feedback');
            
            // Disable all options
            const allOptions = document.querySelectorAll('.options li');
            allOptions.forEach(li => li.onclick = null);

            if (selectedOption === currentQuestion.answer) {
                selectedLi.classList.add('correct');
                feedbackElement.textContent = 'Chính xác! Chuyển sang câu hỏi tiếp theo...';
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1000); // 1-second delay before moving to the next question
            } else {
                selectedLi.classList.add('incorrect');
                feedbackElement.textContent = 'Sai rồi, hãy thử lại!';
                
                // Re-enable options for a new try
                allOptions.forEach(li => {
                    if (!li.classList.contains('incorrect')) {
                        li.onclick = () => checkAnswer(li, li.textContent.trim().charAt(0));
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            shuffledQuestions = [...questions];
            shuffle(shuffledQuestions);
            loadQuestion();
        });
    </script>
</body>
</html>
